name: tide-bot

services:
  tide-bot:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: tide-bot:local
    container_name: tide-bot
    restart: unless-stopped
    ports:
      - '${APP_HOST_PORT:-3102}:8080'
    environment:
      WEBUI_NAME: Tide-Bot
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: 'false'
      WEBUI_FAVICON_URL: /static/tide-bot/tide-bot-96.png
    volumes:
      - tide-bot-data:/app/backend/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8080/health'', timeout=5)"'
        ]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s
    networks:
      - tide-bot-network
volumes:
  tide-bot-data:
    name: tide-bot-data

networks:
  tide-bot-network:
    name: tide-bot-network
    driver: bridge
