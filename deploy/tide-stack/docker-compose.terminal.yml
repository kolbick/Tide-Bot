services:
  tide-bot:
    environment:
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id":"tide-terminal","name":"Tide Terminal","enabled":true,"url":"http://tide-terminal:8000","key":"${TIDE_TERMINAL_API_KEY}","auth_type":"bearer","config":{"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]}}]
    depends_on:
      tide-terminal:
        condition: service_healthy

  tide-terminal:
    build:
      context: ./tide-terminal
      args:
        OPEN_TERMINAL_REF: 9162e808c3aaf8dba38745cea55204a42bbb348d
    image: tide-terminal:local
    container_name: tide-terminal
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: ${TIDE_TERMINAL_API_KEY}
      OPEN_TERMINAL_MULTI_USER: 'true'
      OPEN_TERMINAL_FILE_BROWSER_ROOT: home
      OPEN_TERMINAL_ALLOWED_DOMAINS: ''
    volumes:
      - tide-terminal-homes:/home
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tide-bot-network

volumes:
  tide-terminal-homes:
    name: tide-terminal-homes
