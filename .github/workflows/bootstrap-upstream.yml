name: Bootstrap Open WebUI upstream

on:
  push:
    paths:
      - .github/workflows/bootstrap-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Import Open WebUI dev into Tide-Bot
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tide-Bot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and publish upstream baseline
        env:
          UPSTREAM_URL: https://github.com/open-webui/open-webui.git
          UPSTREAM_REF: dev
          TARGET_BRANCH: bootstrap/open-webui-dev-2026-07-17
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --tags upstream "$UPSTREAM_REF"
          git checkout -B "$TARGET_BRANCH" "upstream/$UPSTREAM_REF"

          # GitHub's temporary Actions token is intentionally not allowed to
          # create upstream workflow files. Tide-Bot will supply its own CI.
          git rm -r .github/workflows || true
          git commit -m "chore: defer upstream workflows during Tide-Bot bootstrap"
          git push --force origin "$TARGET_BRANCH"

      - name: Merge the upstream baseline into Tide-Bot main
        env:
          TARGET_BRANCH: bootstrap/open-webui-dev-2026-07-17
        run: |
          git fetch origin main "$TARGET_BRANCH"
          git switch main
          if ! git merge --no-commit --allow-unrelated-histories "origin/$TARGET_BRANCH"; then
            git checkout --ours README.md
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unexpected merge conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi
          git add -A
          git commit -m "chore: bootstrap Tide-Bot from Open WebUI dev"
          git push origin main

      - name: Report imported commit
        run: |
          printf 'Tide-Bot main now includes Open WebUI dev commit: '
          git rev-parse "origin/$TARGET_BRANCH"
