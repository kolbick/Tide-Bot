[package]
name = "tide-bot"
version = "0.1.0"
description = "Tide-Bot companion desktop shell"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "tide_bot"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
dirs = "5"

[dev-dependencies]
serde_json = "1"
toml = "0.8"
url = "2"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
